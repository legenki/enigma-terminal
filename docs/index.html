<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIP-39: ENIGMA TERMINAL</title>
<meta name="description" content="A cyberpunk detective quest that derives real Bitcoin addresses from BIP-39 seed phrases and queries the live blockchain.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="BIP-39: ENIGMA TERMINAL">
<meta property="og:description" content="Recover seed phrases from detective riddles. Real BIP-39 derivation, real block explorer queries, all in the browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🖥️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/gui.css">
</head>
<body>
<div id="shell">

  <!-- One strip above the interface, in the same idiom as every window in it:
       the mark and the wordmark on the left, status and the two controls on
       the right. The glitch survives at 18px rather than as a wall. -->
  <header id="glitch-bar">
    <canvas id="glitch-canvas" role="img" aria-label="BIP-39: Enigma Terminal"></canvas>
    <span class="bar__mark"><b>BIP-39</b><span class="bar__sub">Enigma Terminal</span></span>
    <span class="bar__spacer"></span>
    <span id="bar-pulse" class="bar__pulse" title="Last block"></span>
    <span id="bar-status" class="bar__status"></span>
    <span id="power-led" aria-hidden="true"></span>
    <button id="sound-toggle" class="bar__icon" type="button"
            aria-pressed="true" aria-label="Block sound"></button>
    <div id="light-switch" class="seg" role="group" aria-label="Daylight">
      <button id="light-live" class="seg__btn" type="button" aria-pressed="false">LIVE</button>
      <button id="light-day" class="seg__btn" type="button" aria-pressed="false">DAY</button>
      <button id="light-night" class="seg__btn" type="button" aria-pressed="false">NIGHT</button>
    </div>
    <div id="lang-select"></div>
  </header>

  <main id="stage">
    <!-- The interface. There is only one now: the terminal is a panel in it. -->
    <div id="gui-root"></div>

    <!-- The terminal is a panel now: the GUI adopts this frame when the
         Terminal tab is open, so the canvas and its input survive the move. -->
    <div id="screen-frame" class="is-hidden">
      <canvas id="term-layer"></canvas>
      <input id="keyboard-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="none" spellcheck="false" aria-label="Terminal input">
    </div>
  </main>

</div>

<noscript>
  <div id="noscript-notice">
    <h1>BIP-39: ENIGMA TERMINAL</h1>
    <p>This terminal derives Bitcoin addresses in your browser.<br>It needs JavaScript to run.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
