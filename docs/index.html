<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIP-39: NEON TERMINAL</title>
<meta name="description" content="A cyberpunk detective quest that derives real Bitcoin addresses from BIP-39 seed phrases and queries the live blockchain.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="BIP-39: NEON TERMINAL">
<meta property="og:description" content="Recover seed phrases from detective riddles. Real BIP-39 derivation, real block explorer queries, all in the browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🖥️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/gui.css">
</head>
<body>
<div id="shell">

  <!-- The glitch banner stays above both modes. -->
  <header id="glitch-bar">
    <canvas id="glitch-canvas" role="img" aria-label="BIP-39: Neon Terminal"></canvas>
  </header>

  <main id="stage">
    <!-- GUI mode -->
    <div id="gui-root" class="is-hidden"></div>

    <!-- Command-line mode -->
    <div id="screen-frame" class="is-hidden">
      <canvas id="term-layer"></canvas>
      <canvas id="crt-layer"></canvas>
      <input id="keyboard-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="none" spellcheck="false" aria-label="Terminal input">
    </div>
  </main>

  <!-- Scanlines and vignette for the GUI; the command line has its own shader. -->
  <div id="crt-overlay" aria-hidden="true"></div>

  <footer id="switch-bar">
    <span id="power-led" aria-hidden="true"></span>
    <div class="rocker" role="group" aria-label="Interface mode">
      <button id="mode-gui" class="rocker__btn" type="button" aria-pressed="false">GUI</button>
      <button id="mode-cl" class="rocker__btn" type="button" aria-pressed="false">CL</button>
    </div>
    <span id="switch-hint">F2 switches · CL accepts HELP</span>
    <span class="spacer"></span>
    <div id="crt-switch" role="group" aria-label="CRT simulation">
      <span class="switch-label">CRT</span>
      <div class="rocker">
        <button id="crt-soft" class="rocker__btn" type="button" aria-pressed="false">SOFT</button>
        <button id="crt-off" class="rocker__btn" type="button" aria-pressed="false">OFF</button>
      </div>
    </div>
  </footer>
</div>

<noscript>
  <div id="noscript-notice">
    <h1>BIP-39: NEON TERMINAL</h1>
    <p>This terminal derives Bitcoin addresses in your browser.<br>It needs JavaScript to run.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
