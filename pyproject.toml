[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-terminal"
version = "2.1.0"
description = "ENIGMA TERMINAL — a cyberpunk detective quest over the live Bitcoin network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bitcoin", "bip39", "bip32", "game", "terminal", "cyberpunk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.optional-dependencies]
net = ["requests>=2.31"]
# The linters carry upper bounds and the rest do not, on purpose. A new pytest
# or reference implementation failing is a real signal; a new ruff or mypy
# failing is usually just a new rule, and an unpinned linter turns any upstream
# release into a red build on a tree nobody touched — which is exactly how
# RUF100 broke this one.
dev = [
  "pytest>=8.0",
  "requests>=2.31",
  "mnemonic>=0.20",
  "bip-utils>=2.9",
  "ruff>=0.15.8,<0.16",
  "mypy>=1.18,<2.4",
  "types-requests",
]

[project.scripts]
enigma-terminal = "enigma_terminal.game:main"

[project.urls]
Homepage = "https://legenki.github.io/enigma-terminal/"
Source = "https://github.com/legenki/enigma-terminal"

[tool.setuptools]
packages = ["enigma_terminal"]

[tool.setuptools.package-data]
enigma_terminal = ["../data/*.json", "../data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["PLW1510", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# The import has to follow the sys.path line above it. Stated here rather than
# as an inline noqa: whether E402 is in ruff's default select varies by ruff
# version, so the inline form is itself flagged as unused on some of them.
"tools/generate_cases.py" = ["E402"]
