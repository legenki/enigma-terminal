[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-terminal"
version = "3.0.1"
description = "Build tooling and reference cryptography for ENIGMA TERMINAL, a browser game"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bitcoin", "bip39", "bip32", "game", "terminal", "cyberpunk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

# Not a package anyone installs. The game is the browser build in `docs/`;
# this file exists so `uv` can put the generator's and the test suite's
# dependencies on a contributor's machine. There is no console script and no
# packaged data, because there is nothing to install.
[project.optional-dependencies]
# The linters carry upper bounds and the rest do not, on purpose. A new pytest
# or reference implementation failing is a real signal; a new ruff or mypy
# failing is usually just a new rule, and an unpinned linter turns any upstream
# release into a red build on a tree nobody touched — which is exactly how
# RUF100 broke this one.
dev = [
  "pytest>=8.0",
  "mnemonic>=0.20",
  "bip-utils>=2.9",
  "ruff>=0.15.8,<0.16",
  "mypy>=1.18,<2.4",
]

[project.urls]
Homepage = "https://legenki.github.io/enigma-terminal/"
Source = "https://github.com/legenki/enigma-terminal"

[tool.setuptools]
packages = ["enigma_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["PLW1510", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# The import has to follow the sys.path line above it. Stated here rather than
# as an inline noqa: whether E402 is in ruff's default select varies by ruff
# version, so the inline form is itself flagged as unused on some of them.
"tools/generate_cases.py" = ["E402"]
