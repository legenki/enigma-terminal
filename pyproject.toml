[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neon-terminal"
version = "1.0.0"
description = "BIP-39: NEON TERMINAL — a cyberpunk detective quest over the live Bitcoin network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bitcoin", "bip39", "bip32", "game", "terminal", "cyberpunk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.optional-dependencies]
net = ["requests>=2.31"]
dev = ["pytest>=8.0", "requests>=2.31", "mnemonic>=0.20", "bip-utils>=2.9"]

[project.scripts]
neon-terminal = "neon_terminal.game:main"

[project.urls]
Homepage = "https://legenki.github.io/neon-terminal/"
Source = "https://github.com/legenki/neon-terminal"

[tool.setuptools]
packages = ["neon_terminal"]

[tool.setuptools.package-data]
neon_terminal = ["../data/*.json", "../data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
