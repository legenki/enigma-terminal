name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv python pin ${{ matrix.python-version }}
          uv pip install --system -e ".[dev]"

      - name: Run Linters and Test Suite
        run: |
          ruff check .
          mypy enigma_terminal/
          biome check $(find docs/js tools -type f -name "*.js" -o -name "*.mjs" | grep -v vendor)
          pytest tests -v

      - name: Check the generated web data is committed
        run: |
          python tools/build_web_data.py
          git diff --exit-code -- docs/js/wordlist.js docs/js/campaign.js

      - name: Smoke-test the terminal end to end
        run: |
          python -m enigma_terminal --speed 0 --no-color --lang en --offline \
            -c "CASES" \
            -c "OPEN 1" \
            -c "ENTROPY 00000000000000000000000000000000" \
            -c "DECRYPT abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" \
            -c "STATUS"
