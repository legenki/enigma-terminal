name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # setup-python provides the interpreter the matrix actually asks for.
      # `uv pip install --system` alone did not: it ignores `uv python pin`
      # and installs into the runner's Debian python3.12, which PEP 668 marks
      # externally managed and refuses — so all three jobs failed identically,
      # and none of them was ever testing the version it claimed to.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No cache: this project has no uv.lock, and setup-uv's default
      # cache-dependency-glob (**/uv.lock) hard-fails the job when it matches
      # nothing — which it did on every run, so nothing below ever executed.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned to the version biome.json's $schema names, so the formatter
      # the job runs is the one the config was written for. `latest` meant an
      # upstream release could redden a tree nobody had touched.
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.10

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Show the interpreter the job is actually running
        run: python -c "import sys; print(sys.version)"

      - name: Run Linters and Test Suite
        run: |
          ruff check .
          mypy enigma_terminal/
          biome check $(find docs/js tools -type f \( -name "*.js" -o -name "*.mjs" \) | grep -v vendor)
          pytest tests -v

      - name: Check the generated web data is committed
        run: |
          python tools/build_web_data.py
          git diff --exit-code -- docs/js/wordlist.js docs/js/campaign.js \
                                  docs/js/clients.js docs/js/openings.js \
                                  docs/data/contracts.json
