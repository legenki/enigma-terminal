name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -v

      - name: Check the generated web data is committed
        run: |
          python tools/build_web_data.py
          git diff --exit-code -- docs/js/wordlist.js docs/js/campaign.js

      - name: Smoke-test the terminal end to end
        run: |
          python -m neon_terminal --speed 0 --no-color --lang en --offline \
            -c "CASES" \
            -c "OPEN 1" \
            -c "ENTROPY 00000000000000000000000000000000" \
            -c "DECRYPT abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" \
            -c "STATUS"
